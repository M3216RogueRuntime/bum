<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Project</title>
    <style>
        .calcgrid{
            display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 5px;
			border: 1px solid black;
			padding: 5px;
			width: fit-content;
			margin-left: 10pxs;
			margin-right: 10px;
        }
        .span{
            grid-column: span 3;}

        input[type="button"] {
			width: 100%;
			padding: 20px 40px;
            color: white;
			font-size: 24px;
			font-weight: bold;
			border: lightskyblue;
			border-radius: 5px;
			box-sizing: border-box;
			cursor: pointer;
        }
        .btn-number{
            background-color: green;
        }
        .btn-operator{
            background-color: blue;
        }
        .btn-clear{
            background-color: red;
        }
        .btn-equal{
            background-color: gray;
        }

        input[type="text"] {
			width: 100%;
			padding: 20px 30px;
			font-size: 30px;
			font-weight: bold;
			border-radius: 5px;
			border: 2px solid black;
			box-sizing: border-box;
		}
    </style>
</head>
<body>
    <!--btw if youre new to the river, calc's short for calculator, im js using slang-->
    <div id="calc" class="calcgrid">
        <!--First Row-->
        <div class="span"><input type="text" id="result"></div>
        <div><input type="button" value="c" class="btn-clear" onclick="clr()" /></div>
        <!--Second Row-->
        <div><input type="button" value="1" class="btn-number" onclick="dis('1')" onkeydown="myFunction(event)"></div>
        <div><input type="button" value="2" class="btn-number" onclick="dis('2')" onkeydown="myFunction(event)"></div>
        <div><input type="button" value="3" class="btn-number" onclick="dis('3')" onkeydown="myFunction(event)"></div>
        <div><input type="button" value="/" class="btn-operator" onclick="dis('/')" onkeydown="myFunction(event)"></div>
        <!--Third Row-->
        <div><input type="button" value="4" class="btn-number" onclick="dis('4')" onkeydown="myFunction(event)"></div>
        <div><input type="button" value="5" class="btn-number" onclick="dis('5')" onkeydown="myFunction(event)"></div>
        <div><input type="button" value="6" class="btn-number" onclick="dis('6')" onkeydown="myFunction(event)"></div>
        <div><input type="button" value="*" class="btn-operator" onclick="dis('*')" onkeydown="myFunction(event)"></div>
        <!--Fourth Row-->
        <div><input type="button" value="7" class="btn-number" onclick="dis('7')" onkeydown="myFunction(event)"></div>

    </div>

    <script>
        <!--Clear Button-->
        function clr(){
            document.getElementById("result").value= ""
        }
        <!--Calculator Buttons-->
        function dis(val) {
			document.getElementById("result").value += val
		}
        <!--Type from keyboard-->
        function myFunction(event) {
			if (event.key == '0' || event.key == '1'
				|| event.key == '2' || event.key == '3'
				|| event.key == '4' || event.key == '5'
				|| event.key == '6' || event.key == '7'
				|| event.key == '8' || event.key == '9'
				|| event.key == '+' || event.key == '-'
				|| event.key == '*' || event.key == '/')
				document.getElementById("result").value += event.key;
		}
    </script>

</body>
</html>
